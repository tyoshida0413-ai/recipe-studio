<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>RecipeAI Studio - レシピ自動作成・管理アプリ</title>
  <meta name="description" content="YouTube動画やメモからAIがレシピを自動生成。美しいUIで管理・調理モード付き。Mac・iPad間データ同期対応。">
  <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
  <meta http-equiv="Pragma" content="no-cache">
  <meta http-equiv="Expires" content="0">
  
  <!-- iOS / iPadOS PWAメタタグ（全画面対応） -->
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <meta name="apple-mobile-web-app-title" content="RecipeAI">
  <meta name="theme-color" content="#e05a2b">
  <link rel="manifest" href="/manifest.json">
  <link rel="apple-touch-icon" href="https://images.unsplash.com/photo-1546549032-9571cd6b27df?w=192&q=80">

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;500;600;700&family=Noto+Sans+JP:wght@400;500;600;700&family=JetBrains+Mono:wght@500;600;800&display=swap" rel="stylesheet">
  <script>
    // キャッシュを強制クリアして常に最新バージョンをロード
    if ('caches' in window) {
      caches.keys().then(names => names.forEach(name => caches.delete(name)));
    }
  </script>
</head>
<body>
  <div id="root"></div>
  <script type="module" src="/src/main.jsx"></script>
</body>
</html>
